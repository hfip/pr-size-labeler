name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Action manifest guard
        run: |
          # The secrets context is not available inside action metadata.
          if grep -nE '\{\{[[:space:]]*secrets\.' action.yml; then
            echo "::error::action.yml must not reference the secrets context"
            exit 1
          fi
      - name: Size rules
        run: bash tests/size_test.sh
      - name: Shell syntax
        run: |
          bash -n scripts/size.sh
          bash -n scripts/apply.sh
          bash -n tests/size_test.sh
