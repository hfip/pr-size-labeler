name: Label pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: hfip/pr-size-labeler@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
